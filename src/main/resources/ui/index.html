<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildfire Live Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="layout">
    <section class="hero">
        <p class="eyebrow">Wildfire Expansion And Risk Predictor</p>
        <h1>Live risk board for streaming wildfire predictions.</h1>
        <div class="hero-meta">
            <div>
                <span>Source flow</span>
                <strong>FIRMS -> Kafka -> Flink -> UI</strong>
            </div>
            <div>
                <span>Refresh</span>
                <strong>Every 5 seconds</strong>
            </div>
        </div>
    </section>

    <section class="stats" id="stats"></section>

    <section class="panel">
        <div class="panel-header">
            <div>
                <p class="panel-label">Live Feed</p>
                <h2>Latest predictions</h2>
            </div>
            <p class="panel-hint" id="last-update">Waiting for data</p>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Risk</th>
                    <th>Threat</th>
                    <th>Zone</th>
                    <th>Country</th>
                    <th>Cell</th>
                    <th>Bearing</th>
                    <th>Speed</th>
                    <th>Fallback</th>
                    <th>Time</th>
                </tr>
                </thead>
                <tbody id="prediction-rows">
                <tr>
                    <td colspan="9" class="empty">No predictions yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script src="/app.js"></script>
</body>
</html>
